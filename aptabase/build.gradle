plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'com.aptabase'
    compileSdk 37

    defaultConfig {
        minSdk 16

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // AGP 9 defaults minCompileSdk to compileSdk, which would force every consumer
        // onto compileSdk 37. The library only uses APIs available since minSdk, so keep
        // the historical behaviour of not constraining the consumer's compileSdk.
        aarMetadata {
            minCompileSdk = 16
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {

    implementation 'androidx.test:monitor:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.aptabase'
                artifactId = 'aptabase-kotlin'
                version = '0.1.0'
            }
        }
    }
}
